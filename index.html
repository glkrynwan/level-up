<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Level Up</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1020">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0f1020;--card:#191a30;--card2:#222446;--tx:#eceefb;--mut:#a3a7cc;--ac:#8b7bff;--acx:#1a1340;--ok:#5fd3a0;--bd:#2d3058;--dng:#ff8a8a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
:root[data-theme="light"]{--bg:#f5f5fc;--card:#fff;--card2:#ebebfa;--tx:#1b1c33;--mut:#5b5f86;--ac:#5b49e6;--acx:#fff;--ok:#12805a;--bd:#d9daf0;--dng:#c0392b;color-scheme:light}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 Sora,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding:16px 16px 110px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand b{font-size:20px;display:block}.brand span{color:var(--mut);font-size:12px}
.hr{display:flex;gap:8px;align-items:center}
.chip{background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.ib{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--bd);font-size:18px}
h1{font-size:24px;margin:0 0 2px}h2{font-size:17px;margin:22px 0 10px}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:12px}
.bar{height:10px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:99px;transition:width .35s}
.big{font-size:34px;font-weight:700}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.task{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px 8px 10px 12px;margin-bottom:8px}
.task.done .tn{text-decoration:line-through;color:var(--mut)}
.tn{font-weight:600;overflow-wrap:anywhere}
.chk{width:44px;height:44px;flex:none;border-radius:14px;border:2px solid var(--mut);display:grid;place-items:center;font-size:22px;font-weight:700;color:transparent}
.chk[aria-checked=true]{background:var(--ok);border-color:var(--ok);color:#06241a;animation:pop .25s}
@keyframes pop{50%{transform:scale(1.18)}}
.cat{display:block;width:100%;text-align:left}
.ico{font-size:26px;width:46px;height:46px;border-radius:14px;background:var(--card2);display:grid;place-items:center;flex:none}
.tag{font-size:11px;background:var(--card2);border-radius:99px;padding:2px 8px;color:var(--mut);margin-left:6px;font-weight:400}
.btn{background:var(--ac);color:var(--acx);border-radius:14px;padding:12px 18px;min-height:46px;font-weight:700}
.btn.sec{background:var(--card2);color:var(--tx)}
.btn.dng{background:none;color:var(--dng);border:1px solid var(--dng)}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(88px + env(safe-area-inset-bottom,0px));box-shadow:0 6px 20px #0006;border-radius:99px;padding:14px 22px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav div{display:flex;width:100%;max-width:560px}
nav button{flex:1;padding:10px 4px;min-height:60px;color:var(--mut);font-size:12px;font-weight:600}
nav button span{display:block;font-size:20px}
nav button[aria-current=page]{color:var(--ac)}
.empty{text-align:center;padding:28px 12px;color:var(--mut)}
.empty .btn{margin-top:12px}
.mask{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));border:1px solid var(--bd)}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;min-height:46px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{flex:1;min-width:40px;min-height:44px;border-radius:12px;background:var(--card);border:1px solid var(--bd);font-weight:600}
.days button[aria-pressed=true]{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.acts{display:flex;gap:8px;margin-top:18px}.acts .btn{flex:1}
.mi{display:block;width:100%;text-align:left;padding:14px 8px;min-height:48px;border-bottom:1px solid var(--bd)}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-90px);background:var(--ac);color:var(--acx);padding:10px 18px;border-radius:99px;font-weight:700;z-index:30;transition:transform .25s;max-width:90%;text-align:center}
#toast.on{transform:translate(-50%,0)}
.back{color:var(--ac);font-weight:600;min-height:44px;padding:0}
.hist b{font-size:13px;color:var(--mut);display:block;margin:12px 0 4px;font-weight:600}
.hist div{padding:6px 0;border-bottom:1px solid var(--bd);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .card{margin:0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* ===== Tanggal ===== */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const DAYS=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ===== Data & penyimpanan ===== */
const KEY='levelup.v1';
function seed(){
  const t=today();const c=(name,icon,desc)=>({id:uid(),name,icon,desc,seed:true});
  const cats=[c('Rutinitas Skincare','🧴','Pagi dan malam'),c('Belajar Matematika','📐',''),c('Belajar Coding','💻','')];
  const k=(ci,name,time,freq='daily')=>({id:uid(),cat:cats[ci].id,name,note:'',time,freq,days:[1,3,5],created:t,order:0,seed:true});
  const tasks=[k(0,'Cuci muka pagi','07:00'),k(0,'Pakai sunscreen','07:10'),k(0,'Skincare malam','21:00'),
    k(1,'Latihan 5 soal','', 'daily'),k(1,'Ulas rumus minggu ini','', 'weekly'),k(2,'Coding 30 menit','','daily')];
  tasks.forEach((x,i)=>x.order=i);
  return{v:1,cats,tasks,log:[],xp:0,awarded:{},theme:'dark',seeded:true};
}
function load(){
  try{const r=localStorage.getItem(KEY);if(r){const s=JSON.parse(r);if(valid(s))return s}}catch(e){}
  return seed();
}
const valid=s=>s&&Array.isArray(s.cats)&&Array.isArray(s.tasks)&&Array.isArray(s.log)&&typeof s.xp==='number'&&s.awarded&&typeof s.awarded==='object';
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Gagal menyimpan data di browser ini')}}
save();

/* ===== Logika tugas ===== */
const doneOn=(id,d)=>S.log.some(l=>l.task===id&&l.date===d);
function dueOn(t,d){
  if(t.created>d)return false;
  if(t.freq==='daily')return true;
  if(t.freq==='weekly')return (t.days||[]).includes(parse(d).getDay());
  const first=S.log.find(l=>l.task===t.id);
  return !first||first.date>=d;
}
const dueList=d=>S.tasks.filter(t=>dueOn(t,d));
const catTasks=id=>S.tasks.filter(t=>t.cat===id).sort((a,b)=>a.order-b.order);
function toggle(id){
  const t=S.tasks.find(x=>x.id===id),d=today();if(!t)return;
  const i=S.log.findIndex(l=>l.task===id&&l.date===d);
  if(i>=0){S.log.splice(i,1);save();return render()}
  const cat=S.cats.find(c=>c.id===t.cat);
  S.log.push({id:uid(),task:id,date:d,name:t.name,cat:cat?cat.name:'-',catId:t.cat,at:Date.now()});
  const key=id+'|'+d;let msg=['Nice!','Satu langkah lebih dekat!','Progress bertambah!'][Math.floor(Math.random()*3)];
  if(!S.awarded[key]){
    const before=level(S.xp);S.awarded[key]=1;S.xp+=10;
    if(level(S.xp)>before)msg='🎉 Naik ke Level '+level(S.xp)+'!';
  }
  save();render();toast(msg);
}
const level=xp=>Math.floor(Math.sqrt(xp/50))+1;
function streak(){
  const t=today();let n=0,d=t;
  const dates=S.log.map(l=>l.date);if(!dates.length)return 0;
  const first=dates.reduce((a,b)=>a<b?a:b);
  const has=x=>dates.includes(x);
  if(has(t))n++;d=addDays(t,-1);
  while(d>=first){
    if(has(d))n++;
    else if(dueList(d).length)break;
    d=addDays(d,-1);
  }
  return n;
}

/* ===== UI helpers ===== */
let view='home',catId=null,modal=null,tt;
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),1800)}
const pct=(a,b)=>b?Math.round(a/b*100):0;
const bar=p=>`<div class="bar" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div>`;
function freqText(t){return t.freq==='daily'?'Setiap hari':t.freq==='once'?'Sekali':(t.days||[]).map(i=>DAYS[i]).join(', ')}
function taskRow(t,showCat){
  const d=doneOn(t.id,today()),c=S.cats.find(x=>x.id===t.cat);
  return `<div class="task ${d?'done':''}">
    <button class="chk" role="checkbox" aria-checked="${d}" aria-label="Selesai: ${esc(t.name)}" data-act="toggle" data-id="${t.id}">✓</button>
    <div class="grow"><div class="tn">${esc(t.name)}${t.seed?'<span class="tag">Contoh</span>':''}</div>
    <div class="mut">${d?'Selesai · ':''}${t.time?esc(t.time)+' · ':''}${showCat&&c?esc(c.icon)+' '+esc(c.name):freqText(t)}</div>
    ${t.note?`<div class="mut">${esc(t.note)}</div>`:''}</div>
    <button class="ib" style="border:0;background:none" aria-label="Menu tugas ${esc(t.name)}" data-act="taskmenu" data-id="${t.id}">⋯</button></div>`;
}

/* ===== Layar ===== */
function home(){
  const d=today(),list=dueList(d).sort((a,b)=>{
    const da=doneOn(a.id,d),db=doneOn(b.id,d);if(da!==db)return da?1:-1;
    if(a.time!==b.time)return !a.time?1:!b.time?-1:a.time<b.time?-1:1;
    return a.order-b.order});
  const done=list.filter(t=>doneOn(t.id,d)).length,h=new Date().getHours();
  const hi=h<11?'Selamat pagi':h<15?'Selamat siang':h<18?'Selamat sore':'Selamat malam';
  const ds=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'});
  return `<h1>${hi}!</h1><div class="mut">${esc(ds)}</div>
  <div class="card" style="margin-top:16px"><div class="row"><div class="grow"><div class="mut">Hari ini</div><div class="big">${done}/${list.length}</div></div>
  <div class="mut" style="text-align:right">🔥 Streak ${streak()} hari</div></div>${bar(pct(done,list.length))}</div>
  <h2>Yang perlu dikerjakan</h2>
  ${list.length?list.map(t=>taskRow(t,true)).join(''):`<div class="card empty">Tidak ada tugas untuk hari ini.<br><button class="btn" data-act="goto" data-v="cats">Buka Kategori</button></div>`}
  ${list.length&&done===list.length?'<div class="card empty">✅ Semua tugas hari ini selesai. Kerja bagus!</div>':''}`;
}
function cats(){
  return `<h1>Kategori</h1><div class="mut" style="margin-bottom:14px">Pilih kategori untuk melihat tugasnya.</div>
  ${S.cats.length?S.cats.map(c=>{const ts=catTasks(c.id),n=ts.filter(t=>doneOn(t.id,today())).length,due=ts.filter(t=>dueOn(t,today()));
    const dn=due.filter(t=>doneOn(t.id,today())).length;
    return `<button class="card cat" data-act="opencat" data-id="${c.id}"><div class="row"><div class="ico" aria-hidden="true">${esc(c.icon||'📌')}</div>
    <div class="grow"><b>${esc(c.name)}</b>${c.seed?'<span class="tag">Contoh</span>':''}<div class="mut">${dn}/${due.length} selesai hari ini · ${ts.length} tugas</div></div></div>${bar(pct(dn,due.length))}</button>`}).join('')
  :`<div class="card empty">Belum ada kategori.<br><button class="btn" data-act="newcat">Buat Kategori</button></div>`}
  <button class="btn fab" data-act="newcat">+ Kategori</button>`;
}
function catPage(){
  const c=S.cats.find(x=>x.id===catId);if(!c){view='cats';return cats()}
  const ts=catTasks(c.id);
  return `<button class="back" data-act="goto" data-v="cats">‹ Kategori</button>
  <div class="row" style="margin:6px 0 14px"><div class="ico" aria-hidden="true">${esc(c.icon||'📌')}</div><div class="grow"><h1>${esc(c.name)}</h1><div class="mut">${esc(c.desc)}</div></div>
  <button class="ib" aria-label="Menu kategori" data-act="catmenu">⋯</button></div>
  ${ts.length?ts.map(t=>taskRow(t,false)).join(''):`<div class="card empty">Belum ada tugas di kategori ini.<br><button class="btn" data-act="newtask">Tambah Tugas</button></div>`}
  <button class="btn fab" data-act="newtask">+ Tugas</button>`;
}
function progress(){
  const d=today();let comp=0,sched=0;const per={};
  for(let i=0;i<7;i++){const x=addDays(d,-i);sched+=dueList(x).length;
    S.log.filter(l=>l.date===x).forEach(l=>{comp++;per[l.cat]=(per[l.cat]||0)+1})}
  const td=S.log.filter(l=>l.date===d).length;
  const top=Object.entries(per).sort((a,b)=>b[1]-a[1])[0];
  const lv=level(S.xp),base=50*(lv-1)**2,next=50*lv*lv;
  const recent=[...S.log].sort((a,b)=>b.at-a.at).slice(0,30);const byD={};
  recent.forEach(l=>(byD[l.date]=byD[l.date]||[]).push(l));
  return `<h1>Progres</h1><div class="mut" style="margin-bottom:14px">Pelan tapi pasti.</div>
  <div class="grid"><div class="card"><div class="mut">Selesai hari ini</div><div class="big">${td}</div></div>
  <div class="card"><div class="mut">7 hari terakhir</div><div class="big">${comp}</div></div>
  <div class="card"><div class="mut">Persentase 7 hari</div><div class="big">${Math.min(100,pct(comp,sched))}%</div></div>
  <div class="card"><div class="mut">Streak</div><div class="big">🔥${streak()}</div></div></div>
  <div class="card" style="margin-top:12px"><div class="mut">Level ${lv} · ${S.xp} XP</div>${bar(pct(S.xp-base,next-base))}<div class="mut" style="margin-top:6px">${next-S.xp} XP lagi ke level ${lv+1}</div></div>
  <div class="card"><div class="mut">Kategori terbaik minggu ini</div><b>${top?esc(top[0])+' ('+top[1]+' tugas)':'Belum ada'}</b></div>
  <h2>Riwayat</h2><div class="card hist">${recent.length?Object.keys(byD).map(k=>`<b>${esc(parse(k).toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'short'}))}</b>${byD[k].map(l=>`<div>✓ ${esc(l.name)} <span class="mut">· ${esc(l.cat)}</span></div>`).join('')}`).join(''):'<span class="mut">Belum ada tugas yang selesai.</span>'}</div>`;
}

/* ===== Modal ===== */
function sheet(html){return `<div class="mask" data-act="closeMask"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`}
function modalHtml(){
  if(!modal)return '';
  if(modal.t==='cat'){const c=modal.c||{};return sheet(`<h1>${c.id?'Edit kategori':'Kategori baru'}</h1>
    <label for="f-name">Nama kategori</label><input id="f-name" maxlength="50" value="${esc(c.name)}">
    <label for="f-icon">Ikon / emoji (opsional)</label><input id="f-icon" maxlength="4" value="${esc(c.icon)}">
    <label for="f-desc">Deskripsi (opsional)</label><input id="f-desc" maxlength="100" value="${esc(c.desc)}">
    <div class="acts"><button class="btn sec" data-act="close">Batal</button><button class="btn" data-act="savecat">Simpan</button></div>`)}
  if(modal.t==='task'){const t=modal.k||{freq:'daily',days:[1,2,3,4,5]};return sheet(`<h1>${t.id?'Edit tugas':'Tugas baru'}</h1>
    <label for="f-name">Nama tugas</label><input id="f-name" maxlength="80" value="${esc(t.name)}">
    <label for="f-freq">Jadwal</label><select id="f-freq" data-act="freq"><option value="daily"${t.freq==='daily'?' selected':''}>Setiap hari</option><option value="weekly"${t.freq==='weekly'?' selected':''}>Hari tertentu</option><option value="once"${t.freq==='once'?' selected':''}>Sekali saja</option></select>
    <div id="f-days" ${t.freq==='weekly'?'':'hidden'}><label>Hari</label><div class="days">${DAYS.map((n,i)=>`<button type="button" data-act="day" data-i="${i}" aria-pressed="${(t.days||[]).includes(i)}">${n}</button>`).join('')}</div></div>
    <label for="f-time">Waktu (opsional)</label><input id="f-time" type="time" value="${esc(t.time)}">
    <label for="f-note">Catatan (opsional)</label><textarea id="f-note" rows="2" maxlength="200">${esc(t.note)}</textarea>
    <div class="acts"><button class="btn sec" data-act="close">Batal</button><button class="btn" data-act="savetask">Simpan</button></div>`)}
  if(modal.t==='menu')return sheet(`<h1>${esc(modal.title)}</h1>${modal.items.map(i=>`<button class="mi" ${i[2]?'style="color:var(--dng)"':''} data-act="${i[1]}" data-id="${modal.id||''}">${i[0]}</button>`).join('')}<div class="acts"><button class="btn sec" data-act="close">Tutup</button></div>`);
  if(modal.t==='settings')return sheet(`<h1>Pengaturan</h1>
    <button class="mi" data-act="theme">Tampilan: ${S.theme==='dark'?'Gelap (ganti ke terang)':'Terang (ganti ke gelap)'}</button>
    <button class="mi" data-act="export">Ekspor data (JSON)</button>
    <button class="mi" data-act="import">Impor data (JSON)</button>
    <p class="mut">Data disimpan secara lokal di browser ini saja. Tidak tersinkron antarperangkat, jadi ekspor secara berkala sebagai cadangan.</p>
    <input id="f-file" type="file" accept="application/json,.json" hidden>
    <div class="acts"><button class="btn sec" data-act="close">Tutup</button></div>`);
  return '';
}

/* ===== Render ===== */
function render(){
  const body=view==='home'?home():view==='cats'?cats():view==='cat'?catPage():progress();
  const tab=view==='cat'?'cats':view;
  document.documentElement.dataset.theme=S.theme;
  document.getElementById('app').innerHTML=`<header><div class="brand"><b>⚡ Level Up</b><span>Small Steps. Real Progress.</span></div>
    <div class="hr"><span class="chip">Lv ${level(S.xp)} · ${S.xp} XP</span><button class="ib" aria-label="Pengaturan" data-act="settings">⚙</button></div></header>
    <main>${body}</main>
    <nav aria-label="Navigasi utama"><div>${[['home','🏠','Beranda'],['cats','🗂','Kategori'],['progress','📈','Progres']].map(n=>`<button data-act="goto" data-v="${n[0]}" ${tab===n[0]?'aria-current="page"':''}><span aria-hidden="true">${n[1]}</span>${n[2]}</button>`).join('')}</div></nav>${modalHtml()}`;
  const f=document.getElementById('f-name');if(f&&modal&&!modal.focused){modal.focused=1;f.focus()}
}

/* ===== Aksi ===== */
const $=id=>document.getElementById(id);
function reorder(id,dir){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  const ts=catTasks(t.cat),i=ts.indexOf(t),j=i+dir;if(j<0||j>=ts.length)return;
  [ts[i],ts[j]]=[ts[j],ts[i]];ts.forEach((x,n)=>x.order=n);save();
}
const acts={
  toggle:id=>toggle(id),
  goto:(id,el)=>{view=el.dataset.v;modal=null;render();window.scrollTo(0,0)},
  opencat:id=>{catId=id;view='cat';render();window.scrollTo(0,0)},
  newcat:()=>{modal={t:'cat'};render()},
  catmenu:()=>{modal={t:'menu',title:'Kategori',id:catId,items:[['Edit kategori','editcat'],['Hapus kategori','delcat',1]]};render()},
  editcat:()=>{modal={t:'cat',c:S.cats.find(c=>c.id===catId)};render()},
  delcat:()=>{const n=catTasks(catId).length;if(!confirm('Hapus kategori ini'+(n?' beserta '+n+' tugasnya':'')+'? Riwayat penyelesaian tetap tersimpan.'))return;
    S.cats=S.cats.filter(c=>c.id!==catId);S.tasks=S.tasks.filter(t=>t.cat!==catId);save();modal=null;view='cats';render()},
  savecat:()=>{const name=$('f-name').value.trim();if(!name){toast('Nama kategori wajib diisi');return $('f-name').focus()}
    const v={name,icon:$('f-icon').value.trim(),desc:$('f-desc').value.trim()};
    if(modal.c){Object.assign(modal.c,v)}else{const c={id:uid(),...v};S.cats.push(c);catId=c.id;view='cat'}
    save();modal=null;render()},
  newtask:()=>{modal={t:'task',draft:{freq:'daily',days:[1,2,3,4,5]}};modal.k=modal.draft;render()},
  taskmenu:id=>{const t=S.tasks.find(x=>x.id===id);modal={t:'menu',title:t.name,id,items:[['Edit tugas','edittask'],['Naikkan urutan','up'],['Turunkan urutan','down'],['Hapus tugas','deltask',1]]};render()},
  edittask:id=>{const t=S.tasks.find(x=>x.id===id);modal={t:'task',k:t,days:[...(t.days||[])]};render()},
  up:id=>{reorder(id,-1);modal=null;render()},down:id=>{reorder(id,1);modal=null;render()},
  deltask:id=>{if(!confirm('Hapus tugas ini? Riwayat penyelesaian tetap tersimpan.'))return;S.tasks=S.tasks.filter(t=>t.id!==id);save();modal=null;render()},
  freq:(id,el)=>{$('f-days').hidden=el.value!=='weekly'},
  day:(id,el)=>{const p=el.getAttribute('aria-pressed')!=='true';el.setAttribute('aria-pressed',p)},
  savetask:()=>{const name=$('f-name').value.trim();if(!name){toast('Nama tugas wajib diisi');return $('f-name').focus()}
    const freq=$('f-freq').value,days=[...document.querySelectorAll('[data-act=day]')].filter(b=>b.getAttribute('aria-pressed')==='true').map(b=>+b.dataset.i);
    if(freq==='weekly'&&!days.length){return toast('Pilih minimal satu hari')}
    const v={name,freq,days:freq==='weekly'?days:[],time:$('f-time').value,note:$('f-note').value.trim()};
    if(modal.k.id)Object.assign(modal.k,v);else S.tasks.push({id:uid(),cat:catId,created:today(),order:catTasks(catId).length,...v});
    save();modal=null;render()},
  settings:()=>{modal={t:'settings'};render()},
  theme:()=>{S.theme=S.theme==='dark'?'light':'dark';save();render()},
  export:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='level-up-'+today()+'.json';a.click();toast('Data diekspor')},
  import:()=>$('f-file').click(),
  close:()=>{modal=null;render()},
  closeMask:(id,el,e)=>{if(e.target===el){modal=null;render()}}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.tagName==='SELECT')return;
  const fn=acts[el.dataset.act];if(fn)fn(el.dataset.id,el,e);
});
document.addEventListener('change',e=>{
  if(e.target.dataset.act==='freq')acts.freq(null,e.target);
  if(e.target.id==='f-file'){
    const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const s=JSON.parse(r.result);if(!valid(s))throw 0;
      if(!confirm('Impor akan MENIMPA semua data yang ada sekarang. Lanjutkan?'))return;
      S=s;S.theme=S.theme||'dark';save();modal=null;view='home';render();toast('Data berhasil diimpor')}
      catch(x){toast('File tidak valid')}};
    r.readAsText(f);
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal=null;render()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!modal)render()});
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
</html>
